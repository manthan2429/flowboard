<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .body { font-family: 'Inter', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#132A28"/>

  <!-- navbar -->
  <rect x="0" y="0" width="1200" height="64" fill="#132A28"/>
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="48" y="40" class="display" font-size="18" font-weight="600" fill="#F2EFE7">FlowBoard</text>
  <text x="1030" y="38" class="body" font-size="13" fill="#F2EFE7" opacity="0.6">Manthan</text>
  <text x="1120" y="38" class="body" font-size="13" fill="#F2EFE7" opacity="0.6">Log out</text>

  <!-- board header -->
  <text x="48" y="108" class="body" font-size="13" fill="#F2EFE7" opacity="0.5">← All boards</text>
  <text x="48" y="140" class="display" font-size="24" font-weight="600" fill="#F2EFE7">Q3 Launch</text>

  <!-- members chip -->
  <rect x="900" y="108" width="120" height="40" rx="6" fill="#1C3A37" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <circle cx="922" cy="128" r="10" fill="#E8B34E"/>
  <circle cx="938" cy="128" r="10" fill="#B5562C"/>
  <text x="958" y="132" class="body" font-size="12" fill="#F2EFE7" opacity="0.7">Members</text>

  <!-- add task input -->
  <rect x="1032" y="108" width="120" height="40" rx="6" fill="#1C3A37" stroke="#F2EFE7" stroke-opacity="0.15"/>
  <text x="1044" y="132" class="body" font-size="12" fill="#F2EFE7" opacity="0.4">Add a task</text>

  <!-- columns -->
  <!-- To do -->
  <rect x="48" y="180" width="360" height="480" rx="10" fill="#1C3A37" fill-opacity="0.6" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="72" y="212" class="body" font-size="13" fill="#F2EFE7" opacity="0.7">To do</text>
  <text x="384" y="212" class="body" font-size="12" fill="#F2EFE7" opacity="0.4">2</text>

  <rect x="72" y="232" width="312" height="56" rx="8" fill="#132A28" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="88" y="264" class="body" font-size="13" fill="#F2EFE7">Set up landing page copy</text>

  <rect x="72" y="300" width="312" height="56" rx="8" fill="#132A28" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="88" y="332" class="body" font-size="13" fill="#F2EFE7">Draft onboarding email</text>

  <!-- In progress -->
  <rect x="420" y="180" width="360" height="480" rx="10" fill="#1C3A37" fill-opacity="0.6" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="444" y="212" class="body" font-size="13" fill="#F2EFE7" opacity="0.7">In progress</text>
  <text x="756" y="212" class="body" font-size="12" fill="#F2EFE7" opacity="0.4">2</text>

  <rect x="444" y="232" width="312" height="70" rx="8" fill="#132A28" stroke="#E8B34E" stroke-opacity="0.4"/>
  <text x="460" y="258" class="body" font-size="13" fill="#F2EFE7">Wire up socket rooms</text>
  <text x="460" y="278" class="body" font-size="11" fill="#F2EFE7" opacity="0.5">Board join/leave events per room</text>

  <rect x="444" y="316" width="312" height="56" rx="8" fill="#132A28" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="460" y="348" class="body" font-size="13" fill="#F2EFE7">Design drag states</text>

  <!-- Done -->
  <rect x="792" y="180" width="360" height="480" rx="10" fill="#1C3A37" fill-opacity="0.6" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="816" y="212" class="body" font-size="13" fill="#F2EFE7" opacity="0.7">Done</text>
  <text x="1128" y="212" class="body" font-size="12" fill="#F2EFE7" opacity="0.4">1</text>

  <rect x="816" y="232" width="312" height="56" rx="8" fill="#132A28" stroke="#F2EFE7" stroke-opacity="0.1"/>
  <text x="832" y="264" class="body" font-size="13" fill="#F2EFE7" opacity="0.6">Write auth middleware</text>
</svg>
